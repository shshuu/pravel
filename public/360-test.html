<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pravel 360° 기술 검증</title>
    <link rel="stylesheet" href="/css/style.css">
  </head>
  <body class="test-page">
    <main class="test-panel">
      <a href="/">← Pravel로 돌아가기</a>
      <h1>360° YouTube IFrame API 기술 검증</h1>
      <p>테스트 영상: <code>AFv16Eej3nc</code>. 중앙을 클릭해 재생/일시정지하고, 6px 이상 드래그해 360° 시점을 움직이세요.</p>
      <div class="player-shell test-player-shell">
        <div id="test-player" class="youtube-player" title="대저생태공원 대나무숲 360도 영상"></div>
        <p id="test-player-status" class="player-status" role="status" aria-live="polite">360° 영상을 불러오는 중...</p>
      </div>
      <div class="test-controls">
        <button id="spherical-read" type="button" disabled>현재 spherical 값 읽기</button>
        <button id="spherical-nudge" type="button" disabled>yaw +1° API 테스트</button>
      </div>
      <output id="test-result" class="test-result" aria-live="polite">Player API를 초기화하는 중입니다.</output>
      <p class="small-note">Pointer gesture는 기본 적용됩니다. 하단 96px은 YouTube seek bar, 음량, 설정, 전체화면 control용 안전 영역입니다.</p>
    </main>
    <script src="/js/youtube360.js?v=gesture-1"></script>
    <script src="/js/360-test.js?v=gesture-1"></script>
  </body>
</html>
